<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webカメラ落書きアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- メインコンテンツエリア -->
        <main>
            <!-- ① カメラプレビュー画面 -->
            <div id="camera-container" class="view active">
                <video id="camera-stream" autoplay playsinline muted></video>
                
                <!-- カウントダウン表示用オーバーレイ -->
                <div id="countdown-overlay" class="countdown-overlay"></div>

                <!-- 上部に配置するコンパクトなコントロール群 -->
                <div class="top-camera-tools">
                    <button id="settings-btn" class="icon-btn half-size" title="設定">⚙️</button>
                    <button id="switch-camera-btn" class="icon-btn half-size" title="カメラ切替">🔄</button>
                    <button id="flash-btn" class="icon-btn half-size" title="フラッシュ">⚡</button>
                    <button id="timer-btn" class="icon-btn half-size" title="タイマー切替">⏱️<span id="timer-badge" class="timer-badge">オフ</span></button>
                </div>

                <div class="camera-controls">
                    <button id="capture-btn" class="btn primary">写真を撮る</button>
                </div>
            </div>

            <!-- ② 撮影プレビュー画面（確認用） -->
            <div id="preview-container" class="view">
                <div class="preview-wrapper">
                    <div id="cheki-preview-frame" class="cheki-frame">
                        <img id="preview-img" src="" alt="Captured">
                    </div>
                </div>
                <div class="editor-controls">
                    <button id="preview-retake-btn" class="btn secondary">撮り直す</button>
                    <button id="preview-ok-btn" class="btn primary">保存して落書きへ</button>
                </div>
            </div>

            <!-- ③ お絵描き・編集（デザインモード）画面 -->
            <div id="editor-container" class="view">
                <div class="canvas-wrapper">
                    <!-- 9:16チェキ風キャンバス -->
                    <canvas id="paint-canvas" width="1080" height="1920"></canvas>
                </div>
                
                <!-- アイコン化されたツールバー -->
                <div class="icon-toolbar">
                    <button id="tool-color" class="icon-btn" title="カラー">🎨</button>
                    <button id="tool-size" class="icon-btn" title="ペンの太さ">✒️</button>
                    <button id="tool-eraser" class="icon-btn" title="消しゴム">🧹</button>
                    <button id="tool-stamp" class="icon-btn" title="スタンプ">⭐</button>
                    <button id="tool-clear" class="icon-btn" title="リセット">🗑️</button>
                </div>

                <!-- 完了・再撮影ボタン -->
                <div class="editor-controls">
                    <button id="retake-btn" class="btn secondary">撮り直す</button>
                    <button id="save-btn" class="btn primary">画像を保存</button>
                </div>
            </div>
        </main>
    </div>

    <!-- ポップアップモーダル（各種設定・ツール用） -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-body">
                <!-- JSで動的に中身が切り替わります -->
            </div>
            <button id="modal-close-btn" class="btn primary">閉じる</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
