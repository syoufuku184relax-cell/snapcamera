<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webカメラ落書きアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <main>
            <div id="camera-container" class="view active">
                <video id="camera-stream" autoplay playsinline muted></video>
                <div class="camera-controls">
                    <button id="capture-btn" class="btn primary">写真を撮る</button>
                    <button id="switch-camera-btn" class="btn secondary">カメラ切替</button>
                </div>
            </div>

            <div id="editor-container" class="view">
                <canvas id="paint-canvas" width="1080" height="1920"></canvas>
                
                <div class="icon-toolbar">
                    <button id="tool-color" class="icon-btn" title="カラー">🎨</button>
                    <button id="tool-size" class="icon-btn" title="ペンの太さ">✒️</button>
                    <button id="tool-eraser" class="icon-btn" title="消しゴム">🧹</button>
                    <button id="tool-stamp" class="icon-btn" title="スタンプ">⭐</button>
                    <button id="tool-clear" class="icon-btn" title="リセット">🗑️</button>
                </div>

                <div class="editor-controls">
                    <button id="retake-btn" class="btn secondary">撮り直す</button>
                    <button id="save-btn" class="btn primary">画像を保存</button>
                </div>
            </div>
        </main>
    </div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <div id="modal-body">
                </div>
            <button id="modal-close-btn" class="btn primary">閉じる</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
