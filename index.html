<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Webカメラ落書きアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <!-- メインコンテンツエリア -->
        <main>
            <!-- カメラプレビュー画面 -->
            <div id="camera-container" class="view active">
                <video id="camera-stream" autoplay playsinline muted></video>
                <div class="camera-controls">
                    <button id="capture-btn" class="btn primary">写真を撮る</button>
                    <button id="switch-camera-btn" class="btn secondary">カメラ切替</button>
                </div>
            </div>

            <!-- お絵描き・編集画面 -->
            <div id="editor-container" class="view">
                <!-- 9:16キャンバス -->
                <canvas id="paint-canvas" width="1080" height="1920"></canvas>
                
                <!-- お絵描きツールバー -->
                <div class="paint-tools">
                    <div class="tool-group">
                        <label>色: <input type="color" id="pen-color" value="#ff3366"></label>
                        <label>太さ: <input type="range" id="pen-size" min="2" max="50" value="8"></label>
                    </div>
                    <div class="tool-group">
                        <button id="eraser-btn" class="btn small">消しゴム</button>
                        <button id="clear-btn" class="btn small">リセット</button>
                    </div>
                </div>

                <!-- 完了・再撮影ボタン -->
                <div class="editor-controls">
                    <button id="retake-btn" class="btn secondary">撮り直す</button>
                    <button id="save-btn" class="btn primary">画像を保存</button>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
